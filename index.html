<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blueshift SEA — Current Pricing</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #080c10;
      --panel:    #0d1117;
      --border:   #1e2a38;
      --accent:   #00d4ff;
      --accent2:  #00ff88;
      --accent3:  #ffaa00;
      --text:     #c8d8e8;
      --text-dim: #6a8aa0;
      --glow:     0 0 12px rgba(0,212,255,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      padding: 32px 16px 64px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(20px, 4vw, 36px);
      font-weight: 700;
      color: var(--accent);
      text-shadow: var(--glow);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    header p {
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 8px;
      letter-spacing: 1px;
    }

    #last-updated {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .card-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,212,255,0.04);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      padding: 10px 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }

    tr:last-child td { border-bottom: none; }

    td.label { color: var(--text); }
    td.cost  { text-align: right; color: var(--accent2); font-weight: 600; }

    .plus-val {
      display: inline-block;
      background: rgba(0,212,255,0.1);
      color: var(--accent);
      border: 1px solid rgba(0,212,255,0.3);
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 12px;
      margin-right: 6px;
    }

    .discount-row {
      background: rgba(255,170,0,0.06);
    }
    .discount-row td { color: var(--accent3); }
    .discount-row td.cost { color: var(--accent3); }

    .loading {
      text-align: center;
      color: var(--text-dim);
      padding: 48px 0;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .error {
      text-align: center;
      color: #ff4466;
      padding: 48px 0;
      font-size: 14px;
    }

    footer {
      text-align: center;
      margin-top: 48px;
      color: var(--text-dim);
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<header>
  <h1>Blueshift SEA Pricing</h1>
  <p>Socket Enhancement Assembly — Current Rates</p>
  <div id="last-updated"></div>
</header>

<div class="container" id="content">
  <div class="loading">LOADING PRICING DATA...</div>
</div>

<footer>
  Prices updated in real-time from the Blueshift admin panel.
</footer>

<script>
  const DB_URL = 'https://blueshift-sea-pricing-default-rtdb.firebaseio.com/pricing.json';

  function fmt(n) {
    return Number(n).toLocaleString() + ' cr';
  }

  function render(cfg) {
    const content = document.getElementById('content');

    if (cfg.lastUpdated) {
      const d = new Date(cfg.lastUpdated);
      document.getElementById('last-updated').textContent =
        'Last updated: ' + d.toLocaleString();
    }

    let html = '';

    // ── Rare Loot ──────────────────────────────────────────────────
    if (cfg.rareLoot && cfg.rareLoot.length) {
      html += `
        <div class="card">
          <div class="card-header">Rare Components</div>
          <table>`;
      cfg.rareLoot.forEach(rl => {
        html += `<tr>
          <td class="label">${rl.label}</td>
          <td class="cost">${fmt(rl.cost)}</td>
        </tr>`;
      });
      html += `</table></div>`;
    }

    // ── Power Bits ─────────────────────────────────────────────────
    if (cfg.powerBits && cfg.powerBits.length) {
      html += `
        <div class="card">
          <div class="card-header">Power Bit Costs (per bit)</div>
          <table>`;
      cfg.powerBits.forEach(pb => {
        html += `<tr>
          <td class="label"><span class="plus-val">+${pb.plusVal}</span> Power Bit</td>
          <td class="cost">${fmt(pb.cost)}</td>
        </tr>`;
      });
      html += `</table></div>`;
    }

    // ── Labor & Discount ───────────────────────────────────────────
    html += `
      <div class="card">
        <div class="card-header">Labor & Discounts</div>
        <table>
          <tr>
            <td class="label">Labor (per SEA crafted)</td>
            <td class="cost">${fmt(cfg.laborCost || 0)}</td>
          </tr>`;

    if (cfg.bccDiscount && cfg.bccDiscount > 0) {
      const pct = Math.round(cfg.bccDiscount * 100);
      const label = cfg.discountLabel || 'BCC Discount';
      html += `<tr class="discount-row">
        <td class="label">${label}</td>
        <td class="cost">−${pct}% off total</td>
      </tr>`;
    }

    html += `</table></div>`;

    content.innerHTML = html;
  }

  async function load() {
    try {
      const res  = await fetch(DB_URL);
      const data = await res.json();
      if (!data || typeof data !== 'object') throw new Error('No pricing data found.');
      render(data);
    } catch (e) {
      document.getElementById('content').innerHTML =
        `<div class="error">Could not load pricing data.<br><small>${e.message}</small></div>`;
    }
  }

  load();
</script>
</body>
</html>
